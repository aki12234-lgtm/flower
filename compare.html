<!doctype html>
<html lang="en">
<head>

<title>Flower — v1 against v2</title>
<style>
  :root { color-scheme: dark; }

  @media (max-width: 700px) {
    body { padding: 16px; }
    .row { grid-template-columns: 1fr 1fr; }
    .row h3 { grid-column: 1 / -1; margin: 0; }
