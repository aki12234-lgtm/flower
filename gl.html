<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower — 3D renderer</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:18px; background:#0b0b0e; color:#f2ece0;
         font:13px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1 { font:400 20px/1.3 Georgia,serif; margin:0 0 4px; }
  p { color:rgba(242,236,224,0.6); margin:0 0 16px; max-width:74ch; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  button, select, input { font:inherit; color:#f2ece0; background:rgba(255,255,255,0.06);
    border:1px solid rgba(242,236,224,0.22); border-radius:8px; padding:6px 11px; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { border:1px solid rgba(242,236,224,0.14); border-radius:10px; overflow:hidden; background:#08080a; }
  .card canvas { display:block; width:100%; height:620px; }
  .card .lbl { padding:8px 11px; border-top:1px solid rgba(242,236,224,0.12); font-size:12px;
               color:rgba(242,236,224,0.7); }
  #err { color:#ef8a7a; white-space:pre-wrap; font-family:ui-monospace,monospace; font-size:12px; }
</style>
</head>
<body>
  <h1>3D renderer</h1>
  <p>
    Same simulation, same growth data, same tuning. Real geometry, one directional
    light with a shadow map, and a camera pass doing depth of field, tonemapping
    and grain.
  </p>
  <div class="controls">
    <label>turns <input id="turns" type="number" value="15" min="2" max="40" style="width:64px"></label>
    <label>seed <input id="seed" type="text" value="7" style="width:80px"></label>
    <button id="go">grow</button>
    <button id="shuffle">new seed</button>
  </div>
  <div id="err"></div>
  <div class="grid" id="grid"></div>
  <script type="module" src="src/gl/devgl.js"></script>
</body>
</html>
