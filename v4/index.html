<!doctype html>
<!--
  v4: v3's game, drawn flat. The same rules, prompts and plant as the page at
  the root, from the same source; only the drawing differs — a plain 2D canvas
  (src/flat) instead of the 3D renderer, which data-renderer below asks for.
  It keeps the same saved game as v3, so the two show one plant both ways.
-->
<html lang="en" data-renderer="flat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower — v4</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>

<canvas id="stage"></canvas>

<!-- Everything below floats over the one continuous canvas. -->
<div id="overlay">

  <button id="return-now" class="chip" hidden>&#8593; now</button>
  <button id="restart" class="chip">start again</button>
  <button id="finish" class="chip finish" hidden>let it be finished</button>

  <div id="note" class="note" hidden></div>

  <section id="prompt-panel" class="panel" hidden>
    <p id="prompt-text" class="prompt"></p>
    <div id="response"></div>
  </section>

  <aside id="inspector" class="inspector" hidden>
    <div class="insp-step"></div>
    <div class="insp-question"></div>
    <div class="insp-answer"></div>
  </aside>

  <section id="ending" class="curtain" hidden>
    <div class="curtain-inner">
      <p id="ending-line" class="ending-line"></p>
      <button id="ending-go" class="chip solid">continue</button>
    </div>
  </section>

  <section id="reflection" class="curtain" hidden>
    <div class="curtain-inner wide">
      <label class="field">
        <span>Give it a name.</span>
        <input id="plant-name" type="text" maxlength="60" autocomplete="off" placeholder="&#8230;">
      </label>
      <label class="field">
        <span>Say what you like about how it went. This is not read by anything.</span>
        <textarea id="plant-reflection" rows="6" maxlength="2000" placeholder="&#8230;"></textarea>
      </label>
      <button id="seal" class="chip solid">seal the specimen</button>
    </div>
  </section>

  <section id="specimen" class="curtain" hidden>
    <div class="curtain-inner wide specimen-card">
      <h1 id="spec-name"></h1>
      <dl id="spec-facts"></dl>
      <p id="spec-reflection"></p>
      <div class="specimen-actions">
        <button id="spec-look" class="chip">look at it</button>
        <button id="spec-new" class="chip solid">begin another</button>
      </div>
    </div>
  </section>

  <button id="spec-back" class="chip" hidden>&#8592; the specimen card</button>
</div>

<!--
  A plain script, deliberately: this one still runs when the module below cannot.
  Opened straight off the disk as a file:// URL, every ES module import is
  blocked by the browser's origin rules, so main.js never executes and the page
  stays blank with nothing said. That is far and away the likeliest reason this
  will not start, and it needs to explain itself rather than look broken.
-->
<script>
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      var p = document.createElement('div');
      p.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;padding:32px;'
        + 'background:#0b0b0e;color:#f2ece0;z-index:99;'
        + 'font:15px/1.7 ui-sans-serif,system-ui,sans-serif';
      p.innerHTML = '<div style="max-width:56ch">'
        + '<h1 style="font:400 24px/1.3 Georgia,serif;margin:0 0 12px">This needs to be served, not opened</h1>'
        + '<p style="color:rgba(242,236,224,0.75);margin:0 0 14px">'
        + 'The page was opened straight from the disk. Browsers refuse to load '
        + 'JavaScript modules that way, so nothing here can start.</p>'
        + '<p style="color:rgba(242,236,224,0.75);margin:0 0 10px">'
        + 'From the project folder, run:</p>'
        + '<pre style="background:rgba(255,255,255,0.07);padding:12px 14px;border-radius:8px;'
        + 'font:13px/1.5 ui-monospace,monospace;margin:0 0 12px">node tools/serve.js</pre>'
        + '<p style="color:rgba(242,236,224,0.75);margin:0">'
        + 'then open <b>http://localhost:5173</b>.</p></div>';
      document.body.appendChild(p);
    });
  }
</script>
<!-- The version switch. See switch.js. -->
<script src="../switch.js" data-version="v4"></script>
<script type="module" src="../src/main.js"></script>
</body>
</html>
