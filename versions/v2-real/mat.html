<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flower — materials sheet</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px; background: #0b0b0e; color: #f2ece0;
         font: 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font: 400 20px/1.3 Georgia, serif; margin: 0 0 10px; }
  #bar { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  label { color: rgba(242,236,224,0.6); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           border: 1px solid rgba(242,236,224,0.25); background: rgba(242,236,224,0.08); color: inherit; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  figure { margin: 0; }
  figcaption { margin-top: 5px; color: rgba(242,236,224,0.55); }
</style>
</head>
<body>
  <h1>Materials sheet</h1>
  <div id="bar">
    <label>zoom <input id="zoom" type="number" value="2.4" step="0.2" min="0.4" style="width:5em"></label>
    <label>turns <input id="turns" type="number" value="9" min="2" max="30" style="width:4em"></label>
    <button id="redraw">redraw</button>
    <button id="snap">save PNGs</button>
  </div>
  <div id="grid"></div>
  <script type="module" src="src/gl/devmat.js"></script>
</body>
</html>
